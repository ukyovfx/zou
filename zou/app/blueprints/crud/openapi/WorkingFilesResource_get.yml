Get working files
---
tags:
  - Crud
description: Retrieve WorkingFiles with authorization scope. Non-admin users
  must provide task_id or entity_id. task_id allows assigned artists and
  project managers to query that task; entity_id allows project managers to
  query that entity. Unscoped queries are available only to administrators.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to include relations
  - in: query
    name: task_id
    required: false
    schema:
      type: string
      format: uuid
    description: Scope the result to a task the current user may access
  - in: query
    name: entity_id
    required: false
    schema:
      type: string
      format: uuid
    description: Scope the result to an entity available to a project manager
responses:
    200:
      description: Working files retrieved successfully
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: Invalid filter format or query error
